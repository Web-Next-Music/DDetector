name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: DDetector

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Load pinned dependency versions
        shell: bash
        run: cat packaging/deps.env >> "$GITHUB_ENV"

      - name: Identify Linux toolchain cache
        id: toolchain-key
        shell: bash
        run: |
          # Refresh rolling Homebrew dependencies weekly, never across runner images.
          echo "key=linux-homebrew-installed-v1-${ImageOS}-${ImageVersion}-${RUNNER_ARCH}-$(date -u +%G-%V)-${{ hashFiles('packaging/deps.env', '.github/workflows/release.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore installed Homebrew toolchain
        id: homebrew
        uses: actions/cache/restore@v4
        with:
          path: /home/linuxbrew/.linuxbrew
          key: ${{ steps.toolchain-key.outputs.key }}

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          # Packaging needs the distribution FFmpeg with a portable ELF loader, not Linuxbrew's.
          sudo apt-get install --no-install-recommends -y ffmpeg libegl1 libgl1 libopengl0
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          if [[ '${{ steps.homebrew.outputs.cache-hit }}' != 'true' ]]; then
            # Keep runtime image/Wayland plugins and LinguistTools without the Qt umbrella.
            brew install --force-bottle ffmpeg cmake ninja ccache qtbase qtdeclarative qtmultimedia qtsvg qtimageformats qtwayland qttools qtkeychain libgit2 pkgconf libarchive dpkg desktop-file-utils extra-cmake-modules
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "QMAKE=$(brew --prefix qtbase)/bin/qmake" >> "$GITHUB_ENV"
          echo "BREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "QT_VERSION=$(brew list --versions qtbase | cut -d' ' -f2)" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.native-deps:$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Save installed Homebrew toolchain
        if: steps.homebrew.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/linuxbrew/.linuxbrew
          key: ${{ steps.toolchain-key.outputs.key }}

      - name: Cache native Qt dependencies
        id: native-deps
        uses: actions/cache/restore@v4
        with:
          path: .native-deps
          key: linux-native-deps-v2-${{ steps.toolchain-key.outputs.key }}-qt${{ env.QT_VERSION }}

      - name: Build native Qt dependencies
        if: steps.native-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dependencies .native-deps
          git clone --depth 1 --branch "$LXQT_BUILD_TOOLS_VERSION" https://github.com/lxqt/lxqt-build-tools.git build/dependencies/lxqt-build-tools
          cmake -S build/dependencies/lxqt-build-tools -B build/dependencies/lxqt-build-tools-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.native-deps"
          cmake --build build/dependencies/lxqt-build-tools-build --parallel
          cmake --install build/dependencies/lxqt-build-tools-build

          git clone --depth 1 --branch "$QTERMWIDGET_VERSION" https://github.com/lxqt/qtermwidget.git build/dependencies/qtermwidget
          cmake -S build/dependencies/qtermwidget -B build/dependencies/qtermwidget-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.native-deps" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.native-deps;$(brew --prefix)" -DBUILD_EXAMPLE=OFF
          cmake --build build/dependencies/qtermwidget-build --parallel
          cmake --install build/dependencies/qtermwidget-build

          git clone --depth 1 --branch "v$SYNTAX_HIGHLIGHTING_VERSION" https://github.com/KDE/syntax-highlighting.git build/dependencies/syntax-highlighting
          cmake -S build/dependencies/syntax-highlighting -B build/dependencies/syntax-highlighting-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.native-deps" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.native-deps;$(brew --prefix)" -DBUILD_TESTING=OFF -DQRC_SYNTAX=OFF
          cmake --build build/dependencies/syntax-highlighting-build --parallel
          cmake --install build/dependencies/syntax-highlighting-build

      - name: Save native Qt dependencies
        if: steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .native-deps
          key: ${{ steps.native-deps.outputs.cache-primary-key }}

      - name: Cache packaging tools
        id: packaging-tools
        uses: actions/cache/restore@v4
        with:
          path: build/tools
          key: linux-packaging-tools-${{ hashFiles('packaging/deps.env') }}

      - name: Cache C++ compiler output
        id: linux-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-${{ github.ref_name }}-
            linux-ccache-

      - name: Build Linux packages
        id: linux-build
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GIT_TAG: ${{ github.ref_name }}
          QTERMWIDGET_DATA_DIR: ${{ github.workspace }}/.native-deps/share/qtermwidget6
          SYNTAX_HIGHLIGHTING_DATA_DIR: ${{ github.workspace }}/.native-deps/share/org.kde.syntax-highlighting
        run: |
          VERSION="${VERSION#v}" python3 scripts/build-dist.py linux

      - name: Save C++ compiler output
        if: ${{ !cancelled() && steps.linux-build.outcome != 'skipped' && steps.linux-ccache.outputs.cache-hit != 'true' && steps.linux-ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.linux-ccache.outputs.cache-primary-key }}

      - name: Save verified packaging tools
        if: ${{ !cancelled() && steps.packaging-tools.outputs.cache-hit != 'true' && steps.packaging-tools.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: build/tools
          key: ${{ steps.packaging-tools.outputs.cache-primary-key }}

      - name: Validate Linux packages
        shell: bash
        run: |
          test -x build/native/AppDir/AppRun
          desktop-file-validate build/native/AppDir/usr/share/applications/ddetector-qt.desktop
          DEB_PACKAGE=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          ARCH_PACKAGE=$(find dist -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          APPIMAGE=$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$DEB_PACKAGE"
          test -n "$ARCH_PACKAGE"
          test -n "$APPIMAGE"
          dpkg-deb --info "$DEB_PACKAGE"
          bsdtar -tf "$ARCH_PACKAGE" | grep -qx '.PKGINFO'
          for PACKAGE in "$ARCH_PACKAGE" "$DEB_PACKAGE"; do
            ROOT=$(mktemp -d)
            if [[ "$PACKAGE" == *.deb ]]; then
              dpkg-deb --extract "$PACKAGE" "$ROOT"
            else
              bsdtar -xf "$PACKAGE" -C "$ROOT"
            fi
            desktop-file-validate "$ROOT/usr/share/applications/ddetector-qt.desktop"
            grep -qx 'Exec=ddetector' "$ROOT/usr/share/applications/ddetector-qt.desktop"
            grep -qx 'Icon=ddetector-qt' "$ROOT/usr/share/applications/ddetector-qt.desktop"
            cmp "$ROOT/usr/share/icons/hicolor/256x256/apps/ddetector-qt.png" qt/assets/icons/app/app-icon.png
            test -L "$ROOT/usr/bin/ddetector"
            rm -rf "$ROOT"
          done
          file "$APPIMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/*.AppImage

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true

      - name: Install Windows build dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          packages=(
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-syntax-highlighting
            mingw-w64-ucrt-x86_64-qtkeychain
            mingw-w64-ucrt-x86_64-libgit2
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nsis
          )
          # Retry transient mirror/download failures without disabling signature checks.
          for attempt in 1 2 3; do
            if pacman -S --needed --noconfirm "${packages[@]}"; then
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::Failed to install Windows build dependencies after 3 attempts"
              exit 1
            fi
            echo "::warning::MSYS2 dependency installation failed (attempt $attempt/3); retrying in 15 seconds"
            sleep 15
          done

      - name: Cache C++ compiler output
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            windows-ccache-${{ github.ref_name }}-
            windows-ccache-

      - name: Locate Go for MSYS2
        shell: pwsh
        run: |
          $goBin = Split-Path (Get-Command go.exe -ErrorAction Stop).Source
          "GO_BIN=$goBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer
        shell: msys2 {0}
        env:
          VERSION: ${{ github.ref_name }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          export PATH="$(cygpath -u "$GO_BIN"):$PATH"
          go version
          VERSION="${VERSION#v}" bash packaging/ci/build.sh windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          compression-level: 0
          path: dist/DDetector-*-Setup.exe

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux-packages,windows-installer}"
          path: release-assets
          merge-multiple: true

      - name: Generate changelog
        run: python3 scripts/release_notes.py --tag "${{ github.ref_name }}" --output release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.pkg.tar.zst
            release-assets/*.deb
            release-assets/*.AppImage
