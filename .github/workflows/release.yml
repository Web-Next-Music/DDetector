name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: DDetector

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Homebrew
          key: linux-homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: linux-homebrew-${{ runner.os }}-

      - name: Install native build dependencies
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cmake ninja ccache qt qtkeychain libgit2 pkgconf libarchive dpkg desktop-file-utils extra-cmake-modules
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "QMAKE=$(brew --prefix qt)/bin/qmake" >> "$GITHUB_ENV"
          echo "BREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.native-deps;$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Cache native Qt dependencies
        id: native-deps
        uses: actions/cache@v4
        with:
          path: .native-deps
          key: linux-native-deps-qt-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Build native Qt dependencies
        if: steps.native-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dependencies .native-deps
          git clone --depth 1 --branch 2.2.0 https://github.com/lxqt/lxqt-build-tools.git build/dependencies/lxqt-build-tools
          cmake -S build/dependencies/lxqt-build-tools -B build/dependencies/lxqt-build-tools-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.native-deps"
          cmake --build build/dependencies/lxqt-build-tools-build --parallel
          cmake --install build/dependencies/lxqt-build-tools-build

          git clone --depth 1 --branch 2.2.0 https://github.com/lxqt/qtermwidget.git build/dependencies/qtermwidget
          cmake -S build/dependencies/qtermwidget -B build/dependencies/qtermwidget-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.native-deps" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" -DBUILD_EXAMPLE=OFF
          cmake --build build/dependencies/qtermwidget-build --parallel
          cmake --install build/dependencies/qtermwidget-build

          git clone --depth 1 --branch v6.13.0 https://github.com/KDE/syntax-highlighting.git build/dependencies/syntax-highlighting
          cmake -S build/dependencies/syntax-highlighting -B build/dependencies/syntax-highlighting-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.native-deps" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" -DBUILD_TESTING=OFF -DQRC_SYNTAX=OFF
          cmake --build build/dependencies/syntax-highlighting-build --parallel
          cmake --install build/dependencies/syntax-highlighting-build

      - name: Cache C++ compiler output
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-${{ github.ref_name }}-
            linux-ccache-

      - name: Build Linux packages
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GIT_TAG: ${{ github.ref_name }}
          QTERMWIDGET_DATA_DIR: ${{ github.workspace }}/.native-deps/share/qtermwidget6
          SYNTAX_HIGHLIGHTING_DATA_DIR: ${{ github.workspace }}/.native-deps/share/org.kde.syntax-highlighting
        run: |
          VERSION="${VERSION#v}" ./scripts/build-dist.sh linux

      - name: Validate Linux packages
        shell: bash
        run: |
          test -x build/native/AppDir/AppRun
          desktop-file-validate build/native/AppDir/usr/share/applications/ddetector-qt.desktop
          DEB_PACKAGE=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          ARCH_PACKAGE=$(find dist -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          APPIMAGE=$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$DEB_PACKAGE"
          test -n "$ARCH_PACKAGE"
          test -n "$APPIMAGE"
          dpkg-deb --info "$DEB_PACKAGE"
          bsdtar -tf "$ARCH_PACKAGE" | grep -qx '.PKGINFO'
          file "$APPIMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/*.AppImage

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-syntax-highlighting
            mingw-w64-ucrt-x86_64-qtkeychain
            mingw-w64-ucrt-x86_64-libgit2

      - name: Cache C++ compiler output
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            windows-ccache-${{ github.ref_name }}-
            windows-ccache-

      - name: Derive version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $numeric = (($version -split '-')[0] -split '\.')
          while ($numeric.Count -lt 3) { $numeric += '0' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GIT_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION_NUM=$($numeric[0]).$($numeric[1]).$($numeric[2])" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Qt frontend
        shell: msys2 {0}
        run: |
          cmake -S qt -B qt/build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DDDETECTOR_GIT_TAG="$GIT_TAG"
          cmake --build qt/build-release --parallel

      - name: Build Go backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\windows | Out-Null
          go build -trimpath -ldflags="-s -w" `
            -o build\windows\ddetector.exe .\cmd\ddetector

      - name: Restore NSIS
        id: cache-nsis
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: windows-nsis-v1

      - name: Install NSIS
        if: steps.cache-nsis.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Deploy Windows runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/windows/dist
          cp build/windows/ddetector.exe build/windows/dist/
          cp qt/build-release/ddetector-qt.exe build/windows/dist/
          /ucrt64/bin/windeployqt6.exe --release --qmldir qt/qml --compiler-runtime build/windows/dist/ddetector-qt.exe

          for pass in 1 2 3 4 5 6; do
            copied=0
            while IFS= read -r dependency; do
              name=$(basename "$dependency")
              if [[ ! -e "build/windows/dist/$name" ]]; then
                cp "$dependency" build/windows/dist/
                copied=1
              fi
            done < <(find build/windows/dist -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
              | xargs -0 -r ldd 2>/dev/null \
              | awk '/=> \/ucrt64\/bin\// {print $3}' \
              | sort -u)
            [[ $copied -eq 0 ]] && break
          done

          if find build/windows/dist -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
            | xargs -0 -r ldd 2>/dev/null | grep -q 'not found'; then
            echo 'Unresolved Windows runtime dependency' >&2
            find build/windows/dist -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
              | xargs -0 -r ldd 2>/dev/null | grep 'not found' >&2
            exit 1
          fi

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $dist = (Resolve-Path "build\windows\dist").Path
          $output = (Join-Path (Resolve-Path "build\windows").Path "DDetector-$env:VERSION-Setup.exe")
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "NSIS compiler not found at $makensis" }
          & $makensis "/DVERSION=$env:VERSION_NUM" "/DDIST_DIR=$dist" "/DOUTPUT_FILE=$output" packaging\windows\installer.nsi
          if (-not (Test-Path $output)) { throw "NSIS did not create $output" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          compression-level: 0
          path: build/windows/DDetector-*-Setup.exe

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux-packages,windows-installer}"
          path: release-assets
          merge-multiple: true

      - name: Generate changelog
        run: python3 scripts/release_notes.py --tag "${{ github.ref_name }}" --output release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.pkg.tar.zst
            release-assets/*.deb
            release-assets/*.AppImage
